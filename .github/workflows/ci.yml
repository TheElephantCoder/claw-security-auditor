name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run self-test suite
        run: node scripts/test.js
      - name: Audit sample skills (text)
        run: node scripts/audit.js --dir data/sample-skills
      - name: Audit sample skills (SARIF, fail-open)
        run: node scripts/audit.js --dir data/sample-skills --output sarif > /tmp/audit.sarif || true
      - name: Validate SARIF is well-formed JSON
        run: node -e "const s=require('/tmp/audit.sarif'); if(s.version!=='2.1.0') throw new Error('bad sarif'); console.log('SARIF OK:', s.runs[0].results.length, 'results')"
      - name: List rules smoke test
        run: node scripts/audit.js --list-rules | head -n 5
      - name: CI gate smoke test (expect exit 1 on risky samples)
        run: |
          if node scripts/audit.js --dir data/sample-skills --fail-on high --output quiet; then
            echo "ERROR: expected exit 1 for high-risk samples" && exit 1
          else
            echo "Gate correctly tripped on high-risk samples"
          fi
